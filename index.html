<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- 1. 手機端 Viewport 標籤與禁止縮放優化 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>zackery game</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: flex-start; 
      min-height: 100vh; 
      margin: 0; 
      padding: 15px;
      background-color: #f4f4f9; 
    }

    h1 { 
      margin: 5px 0 10px 0; 
      color: #333; 
      font-size: 1.4rem;
      text-align: center;
    }
    
    /* 遊戲規則區塊 */
    .rules-card { 
      background: #fff; 
      border-left: 4px solid #dc3545; 
      padding: 10px 14px; 
      border-radius: 6px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
      max-width: 400px; 
      width: 100%; 
      margin-bottom: 12px; 
    }
    .rules-card h3 { margin: 0 0 4px 0; color: #dc3545; font-size: 0.95rem; }
    .rules-card ol, .rules-card ul { margin: 0; padding-left: 18px; font-size: 0.82rem; color: #444; line-height: 1.35; }
    .rules-card ul { margin-top: 4px; }

    .controls { 
      margin-bottom: 12px; 
      display: flex; 
      gap: 8px; 
      align-items: center; 
      flex-wrap: wrap; 
      justify-content: center; 
      width: 100%;
      max-width: 400px;
    }
    
    #info { 
      font-size: 0.95rem; 
      font-weight: bold; 
      margin-bottom: 12px; 
      color: #007bff; 
      text-align: center; 
      min-height: 1.4em;
    }

    /* 2. 棋盤容器改為 100% 寬度 + 保持 1:1 正方形 */
    #game-container { 
      position: relative; 
      width: 100%;
      max-width: 350px; 
      aspect-ratio: 1 / 1; 
      background: #fff; 
      border-radius: 8px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
      touch-action: manipulation; /* 最佳化手機觸控 */
    }

    canvas { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%;
      height: 100%;
      z-index: 1; 
    }

    .grid { 
      display: grid; 
      width: 100%; 
      height: 100%; 
      position: absolute; 
      z-index: 2; 
    }

    .dot-btn { 
      background: none; 
      border: none; 
      outline: none; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent; /* 消除手機點擊灰色遮罩 */
    }

    .dot { 
      width: 18px; 
      height: 18px; 
      background-color: #ccc; 
      border-radius: 50%; 
      transition: all 0.2s; 
      position: relative; 
    }

    .dot-btn:hover .dot:not(.banned):not(.visited) { background-color: #007bff; transform: scale(1.2); }
    .dot.visited { background-color: #28a745; }
    .dot.current { background-color: #dc3545; transform: scale(1.3); box-shadow: 0 0 8px rgba(220,53,69,0.8); }
    .dot.valid { background-color: #ffc107; cursor: pointer; animation: pulse 1.2s infinite alternate; }
    .dot.start-selected { background-color: #17a2b8; transform: scale(1.3); }
    
    /* 禁用格子 */
    .dot.banned { background-color: #343a40; transform: scale(1.1); cursor: not-allowed; }
    .dot.banned::after { content: '✕'; color: #fff; font-size: 10px; font-weight: bold; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.25); }
    }

    button.reset-btn { 
      padding: 6px 12px; 
      font-size: 0.9rem; 
      border: none; 
      background-color: #6c757d; 
      color: white; 
      border-radius: 4px; 
      cursor: pointer; 
    }
    button.reset-btn:hover { background-color: #5a6268; }
    select { 
      padding: 6px 8px; 
      font-size: 0.9rem; 
      border-radius: 4px; 
      border: 1px solid #ccc; 
      background-color: #fff;
    }

    /* 微調點的大小 */
    @media (max-width: 360px) {
      .dot { width: 14px; height: 14px; }
      body { padding: 8px; }
    }
  </style>
</head>

<body>

  <h1>zackery game</h1>

  <div class="rules-card">
    <h3>📜 遊戲流程與規則</h3>
    <b>🎮 遊戲步驟：</b>
    <ol>
      <li><b>進行禁手</b>：雙方開局各選擇 1 個格子進行<b>封鎖</b>。</li>
      <li><b>選擇起點</b>：玩家 A 選擇任意未封鎖的點作為起點並畫線。</li>
      <li><b>輪流接續</b>：雙方從上一玩家的(終點)繼續延伸連線。</li>
    </ol>
    <b>⚠️ 限制與勝負條件：</b>
    <ul>
      <li><b>禁止重複</b>：被封鎖或走過的點<b>不可再次造訪</b>。</li>
      <li><b>勝負判定</b>：<b>無路可走者獲勝</b>（畫出最後一條線的人失敗）。</li>
    </ul>
  </div>
  
  <div class="controls">
    <label for="sizeSelect">盤面：</label>
    <select id="sizeSelect" onchange="initGame()">
      <option value="3">3 x 3</option>
      <option value="5">5 x 5</option>
      <option value="7">7 x 7</option>
    </select>

    <label for="modeSelect">模式：</label>
    <select id="modeSelect" onchange="initGame()">
      <option value="pve">單人模式 AI</option>
      <option value="pvp">雙人對戰</option>
    </select>
    <button class="reset-btn" onclick="initGame()">重新開始</button>
  </div>

  <div id="info">請 玩家 A 選擇要封鎖(Ban)的格子</div>
  
  <div id="game-container">
    <canvas id="lineCanvas"></canvas>
    <div class="grid" id="grid"></div>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const container = document.getElementById('game-container');
    const canvas = document.getElementById('lineCanvas');
    const ctx = canvas.getContext('2d');
    const info = document.getElementById('info');
    const modeSelect = document.getElementById('modeSelect');
    const sizeSelect = document.getElementById('sizeSelect');

    let gridSize = 3;
    let containerWidth = 350;
    let cellSize = 350 / 3;
    let currentPlayer = 'A'; 
    let currentDot = null;   
    let tempStartDot = null; 
    let visited = [];
    let lineHistory = []; // 保存連線數據，供畫面縮放時重繪
    let gameOver = false;
    let isAI = false;

    let phase = 'ban_A';

    // 螢幕大小改變時重繪畫布，避免點與線對不上
    window.addEventListener('resize', resizeCanvas);

    function resizeCanvas() {
      containerWidth = container.clientWidth;
      canvas.width = containerWidth;
      canvas.height = containerWidth;
      cellSize = containerWidth / gridSize;
      redrawAllLines();
    }

    function getPos(r, c) {
      return { x: c * cellSize + cellSize / 2, y: r * cellSize + cellSize / 2 };
    }

    function initGame() {
      gridSize = parseInt(sizeSelect.value);
      containerWidth = container.clientWidth;
      canvas.width = containerWidth;
      canvas.height = containerWidth;
      cellSize = containerWidth / gridSize;

      grid.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;

      grid.innerHTML = '';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      lineHistory = [];
      currentPlayer = 'A';
      currentDot = null;
      tempStartDot = null;
      visited = Array(gridSize).fill(null).map(() => Array(gridSize).fill(false));
      gameOver = false;
      isAI = (modeSelect.value === 'pve');
      phase = 'ban_A';
      
      info.innerText = '請 玩家 A 選擇要封鎖(Ban)的格子';

      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const btn = document.createElement('button');
          btn.className = 'dot-btn';
          
          const dot = document.createElement('div');
          dot.className = 'dot';
          dot.id = `dot-${r}-${c}`;
          
          btn.appendChild(dot);
          btn.addEventListener('click', () => handleDotClick(r, c));
          grid.appendChild(btn);
        }
      }
    }

    function handleDotClick(r, c) {
      if (gameOver) return;

      if (phase === 'ban_A') {
        banDot(r, c);
        phase = 'ban_B';

        if (isAI) {
          info.innerText = 'AI 選擇封鎖格子中...';
          setTimeout(aiBanMove, 400);
        } else {
          info.innerText = '請 玩家 B 選擇要封鎖(Ban)的格子';
        }
        return;
      }

      if (phase === 'ban_B') {
        if (visited[r][c]) return;
        banDot(r, c);
        startPlayPhase();
        return;
      }

      if (isAI && currentPlayer === 'B') return;

      // 第一步：選擇起點
      if (!tempStartDot && !currentDot) {
        if (visited[r][c]) return;

        const validMoves = getValidMoves(r, c);
        if (validMoves.length === 0) {
          info.innerText = '該點無路可走，請選擇其他起點！';
          return;
        }

        tempStartDot = {r, c};
        const el = document.getElementById(`dot-${r}-${c}`);
        el.className = 'dot start-selected';
        info.innerText = '請點擊黃色點作為第一條線的「終點」（可再次點擊原點取消）';
        highlightValidMovesForStart(r, c);
        return;
      }

      // 第一步：取消或選擇終點
      if (tempStartDot && !currentDot) {
        if (tempStartDot.r === r && tempStartDot.c === c) {
          const el = document.getElementById(`dot-${r}-${c}`);
          el.className = 'dot';
          tempStartDot = null;
          clearHighlights();
          info.innerText = isAI ? '請選擇第一條線的「起點」' : `請 玩家 ${currentPlayer} 選擇第一條線的「起點」`;
          return;
        }

        if (isValidMove(tempStartDot.r, tempStartDot.c, r, c)) {
          visited[tempStartDot.r][tempStartDot.c] = true;
          const startEl = document.getElementById(`dot-${tempStartDot.r}-${tempStartDot.c}`);
          startEl.className = 'dot visited';

          drawLine(tempStartDot, {r, c}, currentPlayer);
          selectDot(r, c);
          tempStartDot = null;

          if (!hasValidMoves(r, c)) {
            gameOver = true;
            const nextPlayer = currentPlayer === 'A' ? 'B' : 'A';
            const winnerName = isAI ? (nextPlayer === 'A' ? '玩家 A' : 'AI') : `玩家 ${nextPlayer}`;
            info.innerText = `對手無路可走！${winnerName} 獲勝！`;
            return;
          }

          switchPlayer();
        }
        return;
      }

      // 一般回合移動
      if (isValidMove(currentDot.r, currentDot.c, r, c)) {
        makeMove(r, c);
      }
    }

    function banDot(r, c) {
      visited[r][c] = true;
      const el = document.getElementById(`dot-${r}-${c}`);
      el.className = 'dot banned';
    }

    function aiBanMove() {
      let bestPoint = null;
      let maxNeighbors = -1;

      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          if (!visited[r][c]) {
            let neighbors = getValidMoves(r, c).length;
            if (neighbors > maxNeighbors) {
              maxNeighbors = neighbors;
              bestPoint = { r, c };
            }
          }
        }
      }

      if (bestPoint) {
        banDot(bestPoint.r, bestPoint.c);
      }
      startPlayPhase();
    }

    function startPlayPhase() {
      phase = 'play';
      currentPlayer = 'A';
      info.innerText = isAI ? '請選擇第一條線的「起點」' : '請 玩家 A 選擇第一條線的「起點」';
    }

    function makeMove(r, c) {
      drawLine(currentDot, {r, c}, currentPlayer);
      selectDot(r, c);

      if (!hasValidMoves(r, c)) {
        gameOver = true;
        const nextPlayer = currentPlayer === 'A' ? 'B' : 'A';
        const winnerName = isAI ? (nextPlayer === 'A' ? '玩家 A' : 'AI') : `玩家 ${nextPlayer}`;
        info.innerText = `無路可走！${winnerName} 成功獲得勝利！`;
        return;
      }

      switchPlayer();
    }

    function switchPlayer() {
      currentPlayer = currentPlayer === 'A' ? 'B' : 'A';
      
      if (isAI) {
        if (currentPlayer === 'B') {
          info.innerText = 'AI 思考中...';
          clearHighlights();
          setTimeout(aiMakeMove, 400);
        } else {
          info.innerText = '輪到 玩家 A 移動';
          highlightValidMoves();
        }
      } else {
        info.innerText = `輪到 玩家 ${currentPlayer} 移動`;
        highlightValidMoves();
      }
    }

    function aiMakeMove() {
      if (gameOver) return;

      const validMoves = getValidMoves(currentDot.r, currentDot.c);
      if (validMoves.length === 0) return;

      let bestScore = -Infinity;
      let bestMove = null;

      const maxDepth = gridSize === 3 ? 10 : (gridSize === 5 ? 4 : 2);

      for (const move of validMoves) {
        visited[move.r][move.c] = true;
        let score = minimax(move, 0, false, maxDepth, -Infinity, Infinity);
        visited[move.r][move.c] = false;

        if (score > bestScore) {
          bestScore = score;
          bestMove = move;
        }
      }

      if (bestMove) {
        makeMove(bestMove.r, bestMove.c);
      }
    }

    function minimax(curr, depth, isMaximizing, maxDepth, alpha, beta) {
      const moves = getValidMoves(curr.r, curr.c);

      if (moves.length === 0) {
        return isMaximizing ? (100 - depth) : (-100 + depth);
      }

      if (depth >= maxDepth) {
        return isMaximizing ? -moves.length : moves.length;
      }

      if (isMaximizing) {
        let maxEval = -Infinity;
        for (const move of moves) {
          visited[move.r][move.c] = true;
          let evaluation = minimax(move, depth + 1, false, maxDepth, alpha, beta);
          visited[move.r][move.c] = false;
          maxEval = Math.max(maxEval, evaluation);
          alpha = Math.max(alpha, evaluation);
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (const move of moves) {
          visited[move.r][move.c] = true;
          let evaluation = minimax(move, depth + 1, true, maxDepth, alpha, beta);
          visited[move.r][move.c] = false;
          minEval = Math.min(minEval, evaluation);
          beta = Math.min(beta, evaluation);
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    function isValidMove(r1, c1, r2, c2) {
      if (visited[r2][c2]) return false;
      const dr = Math.abs(r1 - r2);
      const dc = Math.abs(c1 - c2);
      return (dr <= 1 && dc <= 1) && !(dr === 0 && dc === 0);
    }

    function getValidMoves(r, c) {
      const moves = [];
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = r + dr;
          const nc = c + dc;
          if (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize && !visited[nr][nc]) {
            moves.push({ r: nr, c: nc });
          }
        }
      }
      return moves;
    }

    function hasValidMoves(r, c) {
      return getValidMoves(r, c).length > 0;
    }

    function selectDot(r, c) {
      if (currentDot) {
        const prevEl = document.getElementById(`dot-${currentDot.r}-${currentDot.c}`);
        if (prevEl) prevEl.className = 'dot visited';
      }
      currentDot = {r, c};
      visited[r][c] = true;

      const currEl = document.getElementById(`dot-${r}-${c}`);
      if (currEl) currEl.className = 'dot current';
    }

    function drawLine(from, to, player) {
      lineHistory.push({ from, to, player });
      renderLine(from, to, player);
    }

    function renderLine(from, to, player) {
      const p1 = getPos(from.r, from.c);
      const p2 = getPos(to.r, to.c);

      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.strokeStyle = player === 'A' ? '#007bff' : '#dc3545';
      ctx.lineWidth = Math.max(3, containerWidth / 80); // 依螢幕大小自動調整線條粗細
      ctx.stroke();
    }

    function redrawAllLines() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      lineHistory.forEach(line => {
        renderLine(line.from, line.to, line.player);
      });
    }

    function clearHighlights() {
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          if (!visited[r][c]) {
            const el = document.getElementById(`dot-${r}-${c}`);
            if (el) el.className = 'dot';
          }
        }
      }
    }

    function highlightValidMovesForStart(sr, sc) {
      clearHighlights();
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          if (r === sr && c === sc) continue;
          if (visited[r][c]) continue;
          const el = document.getElementById(`dot-${r}-${c}`);
          if (isValidMove(sr, sc, r, c)) {
            el.className = 'dot valid';
          }
        }
      }
    }

    function highlightValidMoves() {
      if (!currentDot) return;
      clearHighlights();
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          if (!visited[r][c]) {
            const el = document.getElementById(`dot-${r}-${c}`);
            if (isValidMove(currentDot.r, currentDot.c, r, c)) {
              el.className = 'dot valid';
            }
          }
        }
      }
    }

    initGame();
  </script>
</body>
</html>
